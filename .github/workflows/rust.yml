name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      build_profile:
        description: "构建模式"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.99.0   # 与 rust-toolchain.toml 保持一致
        targets: x86_64-pc-windows-msvc

    - name: Cache cargo registry & build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build
      shell: pwsh
      run: |
        $profile = "${{ github.event.inputs.build_profile }}"
        if ([string]::IsNullOrEmpty($profile)) { $profile = "release" }
        if ($profile -eq "release") {
          cargo build --release --verbose --target x86_64-pc-windows-msvc
        } else {
          cargo build --verbose --target x86_64-pc-windows-msvc
        }

    - name: Run tests
      shell: pwsh
      run: |
        $profile = "${{ github.event.inputs.build_profile }}"
        if ([string]::IsNullOrEmpty($profile)) { $profile = "release" }
        if ($profile -eq "release") {
          cargo test --release --verbose --target x86_64-pc-windows-msvc
        } else {
          cargo test --verbose --target x86_64-pc-windows-msvc
        }

    - name: Prepare package directory
      shell: pwsh
      run: |
        $profile = "${{ github.event.inputs.build_profile }}"
        if ([string]::IsNullOrEmpty($profile)) { $profile = "release" }
        $src = "target/x86_64-pc-windows-msvc/$profile"
        New-Item -ItemType Directory -Force -Path package | Out-Null
        Copy-Item -Path "$src/*.exe" -Destination package -ErrorAction SilentlyContinue
        Copy-Item -Path "$src/*.dll" -Destination package -ErrorAction SilentlyContinue
        Copy-Item -Path "$src/*.pdb" -Destination package -ErrorAction SilentlyContinue
        # 如有额外资源文件（assets、config 等）可在此复制：
        Copy-Item -Path "assets" -Destination package -Recurse -ErrorAction SilentlyContinue

    - name: Create ZIP archive
      shell: pwsh
      run: |
        $profile = "${{ github.event.inputs.build_profile }}"
        if ([string]::IsNullOrEmpty($profile)) { $profile = "release" }
        $zipName = "rust-windows-x86_64-$profile.zip"
        if (Test-Path $zipName) { Remove-Item $zipName }
        Compress-Archive -Path "package/*" -DestinationPath $zipName -CompressionLevel Optimal
        Get-Item $zipName | Format-List Name, Length

    - name: Upload Windows ZIP artifact
      uses: actions/upload-artifact@v4
      with:
        name: rust-windows-x86_64-${{ github.event.inputs.build_profile || 'release' }}
        path: rust-windows-x86_64-*.zip
        if-no-files-found: error
        retention-days: 30
